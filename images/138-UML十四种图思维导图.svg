<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 836" width="720" height="836" role="img" aria-label="UML 十四种图思维导图：结构图七种与行为图七种，五种常用图高亮">
  <style>
    text { font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", system-ui, sans-serif; }
    .t-title { font-size: 16px; font-weight: 600; fill: #171717; }
    .t-cap { font-size: 12px; fill: #52525B; }
    .t-name { font-size: 14px; font-weight: 500; fill: #171717; }
    .t-desc { font-size: 12px; fill: #52525B; }
    .t-brand { fill: #004D26; }
    .edge { fill: none; stroke: #9A9AA0; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .node-box { fill: #FFFFFF; stroke: #DCDCE0; }
    .root-box { fill: #B4FDD9; stroke: #0FDC78; }
    .focus-box { fill: #E5FFF2; stroke: #6BDCA7; }
    .capsule { fill: #FFFFFF; stroke: #DCDCE0; }
  </style>
  <defs>
    <pattern id="mindGrid" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#C9C9CD" />
    </pattern>
  </defs>
  <rect x="0" y="0" width="720" height="836" fill="#F7F7F8" />
  <rect x="0" y="0" width="720" height="836" fill="url(#mindGrid)" />

  <text class="t-title" x="24" y="32">UML 十四种图 · 思维导图</text>
