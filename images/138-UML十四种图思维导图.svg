    <path class="edge" d="M304 192 H322 Q330 192 330 184 V154 Q330 146 338 146 H356" />
    <path class="edge" d="M304 192 H356" />
    <path class="edge" d="M304 192 H322 Q330 192 330 200 V230 Q330 238 338 238 H356" />
    <path class="edge" d="M304 192 H322 Q330 192 330 200 V276 Q330 284 338 284 H356" />
    <path class="edge" d="M304 192 H322 Q330 192 330 200 V322 Q330 330 338 330 H356" />

    <path class="edge" d="M304 577 H322 Q330 577 330 569 V450 Q330 442 338 442 H356" />
    <path class="edge" d="M304 577 H322 Q330 577 330 569 V496 Q330 488 338 488 H356" />
    <path class="edge" d="M304 577 H322 Q330 577 330 569 V542 Q330 534 338 534 H356" />
    <path class="edge" d="M304 577 H322 Q330 577 330 585 V598 Q330 606 338 606 H356" />
    <path class="edge" d="M304 577 H322 Q330 577 330 585 V644 Q330 652 338 652 H356" />
    <path class="edge" d="M304 577 H322 Q330 577 330 585 V690 Q330 698 338 698 H356" />
    <path class="edge" d="M304 577 H322 Q330 577 330 585 V736 Q330 744 338 744 H356" />

    <g>
