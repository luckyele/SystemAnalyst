    </g>
    <g>
      <rect class="node-box" x="356" y="174" width="336" height="36" rx="8" />
      <text x="368" y="197"><tspan class="t-name">部署图</tspan><tspan class="t-desc" dx="10">软件到硬件的映射</tspan></text>
    </g>
    <g>
      <rect class="node-box" x="356" y="220" width="336" height="36" rx="8" />
      <text x="368" y="243"><tspan class="t-name">包图</tspan><tspan class="t-desc" dx="10">分组结构与依赖</tspan></text>
    </g>
    <g>
      <rect class="node-box" x="356" y="266" width="336" height="36" rx="8" />
      <text x="368" y="289"><tspan class="t-name">组合结构图</tspan><tspan class="t-desc" dx="10">类的内部构成</tspan></text>
    </g>
    <g>
      <rect class="node-box" x="356" y="312" width="336" height="36" rx="8" />
      <text x="368" y="335"><tspan class="t-name">剖面图</tspan><tspan class="t-desc" dx="10">UML 扩展机制</tspan></text>
    </g>

