    </g>
    <g>
      <rect class="focus-box" x="356" y="470" width="336" height="36" rx="8" />
      <text x="368" y="493"><tspan class="t-name t-brand">活动图</tspan><tspan class="t-desc" dx="10">执行流程 · 支持并发</tspan></text>
    </g>
    <g>
      <rect class="focus-box" x="356" y="516" width="336" height="36" rx="8" />
      <text x="368" y="539"><tspan class="t-name t-brand">状态机图</tspan><tspan class="t-desc" dx="10">状态与事件驱动</tspan></text>
    </g>

    <g>
      <rect class="capsule" x="356" y="556" width="96" height="24" rx="12" />
      <text class="t-cap" x="404" y="572" text-anchor="middle" font-weight="500">交互图 · 4 种</text>
    </g>
    <g>
      <rect class="focus-box" x="356" y="588" width="336" height="36" rx="8" />
      <text x="368" y="611"><tspan class="t-name t-brand">序列图</tspan><tspan class="t-desc" dx="10">按时间排序的消息</tspan></text>
    </g>
    <g>
      <rect class="node-box" x="356" y="634" width="336" height="36" rx="8" />
      <text x="368" y="657"><tspan class="t-name">通信图</tspan><tspan class="t-desc" dx="10">链接结构 · 编号消息</tspan></text>
    </g>
    <g>
